name: Instagram publico — teste gratuito

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil Instagram para testar (vazio = todos os 13)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/instagram-reels.yml"
      - "scripts/public_instagram.py"
      - "scripts/browser_probe.py"

permissions:
  contents: write

concurrency:
  group: instagram-public
  cancel-in-progress: false

jobs:
  public-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Receber codigo publico
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar so biblioteca leve
        run: python -m pip install --disable-pip-version-check --no-cache-dir curl_cffi==0.16.3 playwright==1.56.0

      - name: Verificar sintaxe
        run: python -m py_compile scripts/public_instagram.py

      - name: Medir Reels sem login
        env:
          PROFILE_REQUESTED: ${{ inputs.profile || '' }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Primeiro teste seguro: um único perfil, sem varrer todos.
            python scripts/browser_probe.py --profile elianarute_
          elif [[ -n "$PROFILE_REQUESTED" ]]; then
            python scripts/public_instagram.py --profile "$PROFILE_REQUESTED"
          else
            python scripts/public_instagram.py
          fi

      - name: Guardar diagnostico do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-public-readings
          path: data/instagram-public.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar apenas metricas realmente observadas
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          test -f data/instagram-public.json || exit 0
          VERIFIED="$(python -c 'import json;print(int(json.load(open("data/instagram-public.json"))["verified"]))')"
          if [[ "$VERIFIED" != "1" ]]; then
            echo "Instagram nao forneceu contagens verificaveis: nao publicar numeros."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram-public.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified public Instagram Reels snapshot"
            git push
          fi
